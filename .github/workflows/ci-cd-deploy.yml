name: CI/CD - Build & Cloud Run Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build, Test & Cloud Run Deploy
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      REGION: us-central1
      SERVICE_NAME: tacna-soc-web

    steps:
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'tacna-soc/package-lock.json'

      - name: 3. Instalar Dependencias de Tacna SOC
        working-directory: tacna-soc
        run: npm ci

      - name: 4. Verificación Estricta de Tipos (TypeScript Lint)
        working-directory: tacna-soc
        run: npm run lint

      - name: 5. Compilación de Producción de React 19 (Vite Build)
        working-directory: tacna-soc
        run: npm run build

      - name: 6. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 7. Compilación de Contenedor Docker Multi-stage
        uses: docker/build-push-action@v5
        with:
          context: ./tacna-soc
          file: ./tacna-soc/Dockerfile
          load: true
          tags: ${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: 8. Verificación de Credenciales Cloud de GCP
        id: check-gcp
        run: |
          if [ -n "$GCP_PROJECT_ID" ] && [ -n "$GCP_SA_KEY" ]; then
            echo "has_gcp=true" >> $GITHUB_OUTPUT
            echo "✅ Credenciales de GCP detectadas. Procediendo a despliegue en Cloud Run."
          else
            echo "has_gcp=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Secretos GCP_PROJECT_ID y GCP_SA_KEY no configurados en GitHub Secrets."
            echo "✅ Build de producción TypeScript, Vite y Docker validados con éxito al 100%."
          fi

      - name: 9. Autenticación en Google Cloud (Si existen secretos)
        if: steps.check-gcp.outputs.has_gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 10. Configurar gcloud CLI
        if: steps.check-gcp.outputs.has_gcp == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: 11. Autenticar Docker con Artifact Registry de GCP
        if: steps.check-gcp.outputs.has_gcp == 'true'
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 12. Publicar Imagen y Desplegar en Google Cloud Run
        if: steps.check-gcp.outputs.has_gcp == 'true'
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tacna-soc-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker tag ${{ env.SERVICE_NAME }}:${{ github.sha }} $IMAGE_URI
          docker push $IMAGE_URI
          
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $IMAGE_URI \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5

